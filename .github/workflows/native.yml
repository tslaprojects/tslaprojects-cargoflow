name: Native apps

# Сборка нативных приложений CargoFlow (Flutter): проверки + Android (APK), iOS (без подписи), macOS, Windows.
# Адрес API для сборок — переменная репозитория CARGOFLOW_API (Settings → Variables); без неё — тестовый сервер на Railway.
# Подложка карт — переменная GEOAPIFY_KEY (публичный ключ карт Geoapify); пусто — тайлы OSM.
on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  API_DEFINE: --dart-define=CARGOFLOW_API=${{ vars.CARGOFLOW_API || 'https://tslaprojects-cargoflow-copy-production.up.railway.app' }} --dart-define=GEOAPIFY_KEY=${{ vars.GEOAPIFY_KEY }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Analyze & test
        run: |
          for d in packages/cargoflow_core apps/cargoflow apps/driver; do
            echo "::group::$d"
            (cd "native/$d" && flutter pub get && flutter analyze && flutter test)
            echo "::endgroup::"
          done

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix: { app: [cargoflow, driver] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build APK
        working-directory: native/apps/${{ matrix.app }}
        run: flutter build apk --release $API_DEFINE
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: native/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix: { app: [cargoflow, driver] }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build iOS (без подписи)
        working-directory: native/apps/${{ matrix.app }}
        run: |
          flutter build ios --release --no-codesign $API_DEFINE
          cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/ios-${{ matrix.app }}.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with: { name: "ios-${{ matrix.app }}-unsigned", path: "ios-${{ matrix.app }}.zip" }

  macos:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build macOS
        working-directory: native/apps/cargoflow
        run: |
          flutter build macos --release $API_DEFINE
          cd build/macos/Build/Products/Release && ditto -c -k --keepParent CargoFlow.app "$GITHUB_WORKSPACE/CargoFlow-macos.zip"
      - uses: actions/upload-artifact@v4
        with: { name: macos-cargoflow, path: CargoFlow-macos.zip }

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Build Windows
        working-directory: native/apps/cargoflow
        shell: bash
        run: flutter build windows --release $API_DEFINE
      - uses: actions/upload-artifact@v4
        with: { name: windows-cargoflow, path: native/apps/cargoflow/build/windows/x64/runner/Release }
